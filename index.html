<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For My Love ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#ff9ecf,#ffc3e6,#ffe6f2);
  overflow:hidden;
}

.card{
  text-align:center;
  background:white;
  padding:35px 25px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.15);
  max-width:500px;
  width:90%;
  position:relative;
  z-index:2;
}

h1{
  font-size:32px;
  margin-bottom:10px;
  color:#d1005b;
}

.love-text{
  font-size:16px;
  margin-bottom:20px;
  color:#444;
}

img{
  width:220px;
  margin-bottom:15px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  position:relative;
  height:60px;
}

button{
  padding:12px 22px;
  border:none;
  border-radius:30px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

#yes{
  background:#ff4d88;
  color:white;
}

#no{
  background:#eee;
}

#message{
  margin-top:15px;
  font-weight:bold;
  font-size:18px;
  color:#d1005b;
}

/* Floating Hearts */
.heart{
  position:absolute;
  color:#ff4d88;
  font-size:20px;
  animation:float 6s linear infinite;
  opacity:0.6;
}

@keyframes float{
  0%{transform:translateY(100vh) scale(0.5);}
  100%{transform:translateY(-10vh) scale(1.2);}
}
</style>
</head>

<body>

<div class="card">
  <h1>Yad-e-Baiza ❤️</h1>
  <div class="love-text">
    From the moment you came into my life, everything became brighter.<br>
    You are my peace, my happiness, and my favorite person.<br><br>
    Will you be my Valentine?
  </div>

  <img src="https://media.tenor.com/2roX3uxz_68AAAAi/cute-bear-love.gif">

  <div class="buttons" id="btnBox">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 😢</button>
  </div>

  <div id="message"></div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const message = document.getElementById("message");
const btnBox = document.getElementById("btnBox");

let scale = 1;

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 100 - 50;
  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  scale += 0.15;
  yesBtn.style.transform = `scale(${scale})`;
});

yesBtn.addEventListener("click", () => {
  message.innerHTML = "You just made me the happiest person alive ❤️✨<br>I love you forever 💍";
  btnBox.style.display = "none";
});

// Floating hearts generator
function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.animationDuration = (Math.random()*3+3)+"s";
  document.body.appendChild(heart);

  setTimeout(()=>{ heart.remove(); },6000);
}

setInterval(createHeart,500);
</script>

</body>
</html>
